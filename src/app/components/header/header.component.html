<div class="header-container">
  <a class="brand" [routerLink]="['/']">
    <img
      class="brand-logo"
      src="assets/images/atlas_logotipo.svg"
      alt="Atlas - Sistema integrado de evidencias"
    />
  </a>

  <div class="header-lang-container">
    <mat-select
      class="lang-selector"
      [(value)]="langCookie"
      (selectionChange)="cambiarIdioma($event.value)"
    >
      <mat-option *ngFor="let lang of langs" [value]="lang">
        {{ lang }}
      </mat-option>
    </mat-select>
  </div>
</div>
